name: FinSage CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & CA Verification Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Run CA & Statutory Engine Tests
        run: |
          python -m pytest tests/test_ca_tools.py tests/test_calculator.py tests/test_retrieval.py tests/test_ingest.py -v

  docker-build:
    name: Docker Container Build Integrity Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: finsage:ci-test
